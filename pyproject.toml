[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "apscheduler"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["studyops_core*"]
exclude = ["external*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
